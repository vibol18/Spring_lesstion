spring:
  datasource:
    url: jdbc:mysql://localhost:3306/real_school?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # The migrations in db/migration use PostgreSQL syntax (BIGSERIAL), so Flyway
  # stays off for the local MySQL dev database. Hibernate "update" builds the schema.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    com.example.real_school: DEBUG
