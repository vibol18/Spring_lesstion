spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/real_school?sslmode=disable
    username: postgres
    password: real_school_dev_password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
logging:
  level:
    com.example.real_school: DEBUG
