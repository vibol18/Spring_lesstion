name: real_school

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-real_school}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-real_school_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-real_school}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-real_school}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-real_school_dev_password}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtdGVzdGluZy1vbmx5LXByb2R1Y3Rpb24=}
      JWT_ACCESS_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      DB_POOL_SIZE: 5
      DB_MIN_IDLE: 1
      TOMCAT_MAX_THREADS: 50
      TOMCAT_ACCEPT_COUNT: 50
      FILE_UPLOAD_DIR: /tmp/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@school.com}
      ADMIN_PASSWORD: "Admin123!"
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_APP: INFO
      PASSWORD_RESET_EXPIRATION_MINUTES: 30
      OTP_EXPIRATION_MINUTES: 10
      OTP_LENGTH: 6
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
